name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check the ES module
        run: |
          cp script.js /tmp/script.mjs
          node --check /tmp/script.mjs

      - name: Engine and repository tests
        run: node --test tests/engine.test.mjs tests/static.test.mjs

      - name: Verify documentation links and state metadata
        run: node --test tests/static.test.mjs
