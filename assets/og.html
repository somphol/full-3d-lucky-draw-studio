<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lucky Draw Studio — social card</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
    body {
      display: grid;
      grid-template-columns: 1.08fr 0.92fr;
      font-family: "Inter", ui-sans-serif, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", sans-serif;
      color: #eef3fb;
      background:
        radial-gradient(700px 520px at 12% 0%, rgba(63, 214, 196, 0.13), transparent 62%),
        radial-gradient(700px 520px at 92% 6%, rgba(245, 199, 107, 0.12), transparent 64%),
        linear-gradient(160deg, #0b1321 0%, #05080d 100%);
      position: relative;
    }
    .copy { padding: 64px 20px 54px 64px; display: flex; flex-direction: column; justify-content: center; }
    .eyebrow {
      display: inline-flex; align-items: center; gap: 8px; align-self: flex-start;
      padding: 7px 13px; border-radius: 999px;
      border: 1px solid rgba(63, 214, 196, 0.32);
      background: rgba(63, 214, 196, 0.1);
      color: #a8f3e9; font-size: 14px; font-weight: 600; letter-spacing: 0.05em;
    }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: #3fd6c4; }
    h1 {
      margin: 24px 0 14px; font-size: 64px; line-height: 0.98; letter-spacing: -0.035em;
      font-weight: 750;
    }
    h1 em {
      font-style: normal;
      background: linear-gradient(180deg, #fff4d6, #f5c76b 60%, #c99437);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    p { margin: 0; max-width: 470px; color: #93a0b4; font-size: 20px; line-height: 1.5; }
    .meta { margin-top: 30px; display: flex; gap: 10px; flex-wrap: wrap; }
    .meta span {
      padding: 7px 12px; border: 1px solid rgba(255,255,255,0.1); border-radius: 8px;
      color: #c8d4e4; font-size: 13px; letter-spacing: 0.02em;
      background: rgba(255,255,255,0.03);
    }
    .art { position: relative; display: grid; place-items: center; padding: 30px 44px 30px 0; }
    .art img {
      width: 520px; height: 340px; object-fit: cover; object-position: 52% 48%;
      border-radius: 20px; border: 1px solid rgba(255,255,255,0.14);
      box-shadow: 0 34px 80px rgba(0,0,0,0.6);
      transform: rotate(-1.4deg);
    }
    .ring {
      position: absolute; width: 470px; height: 470px; border-radius: 50%;
      border: 1px solid rgba(245,199,107,0.16); pointer-events: none;
    }
    .footer {
      position: absolute; left: 64px; bottom: 26px; color: #5f6c80; font-size: 12px;
      letter-spacing: 0.06em; text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="copy">
    <span class="eyebrow"><span class="dot"></span>Fair pick · Web Crypto</span>
    <h1>Spin a <em>real</em><br>3D lucky draw</h1>
    <p>Orbit the wheel, paste a roster, and reveal the winner with confetti, a fanfare and a draw log
      you can export. English / ไทย.</p>
    <div class="meta">
      <span>Three.js</span><span>Fair draw</span><span>No backend</span><span>Local history</span>
    </div>
  </div>
  <div class="art">
    <div class="ring"></div>
    <img src="studio.png" alt="Lucky Draw Studio 3D wheel">
  </div>
  <div class="footer">Built with OpenCode · DeepSeek V4.1 Flash</div>
</body>
</html>
